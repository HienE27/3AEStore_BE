# Cấu hình AI - OpenAI API (Tùy chọn)
# ============================================
# Để sử dụng OpenAI API để generate description tự động:
# 1. Đăng ký tài khoản tại https://platform.openai.com/
# 2. Tạo API key tại https://platform.openai.com/api-keys
# 3. Thêm API key vào dòng dưới đây:
# ai.openai.api.key=your-api-key-here
#
# Nếu không cấu hình API key, hệ thống sẽ sử dụng template-based generation
# (vẫn hoạt động nhưng mô tả sẽ là template cố định)
#
# URL mặc định của OpenAI API (không cần thay đổi trừ khi bạn dùng proxy)
# ai.openai.api.url=https://api.openai.com/v1/chat/completions

