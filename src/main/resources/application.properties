# ============================================
# DATABASE CONFIGURATION
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/exercise201?useUnicode=yes&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA/HIBERNATE CONFIGURATION
# ============================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.connection.characterEncoding=utf8
spring.jpa.properties.hibernate.connection.useUnicode=true

# Batch fetching for N+1 query optimization
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ============================================
# EMAIL CONFIGURATION (Use .env for password)
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ============================================
# FILE UPLOAD CONFIGURATION
# ============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads
spring.web.resources.static-locations=classpath:/static/,file:uploads/

# ============================================
# AI CONFIGURATION (Optional)
# ============================================
# Create .env file with: GEMINI_API_KEY, OPENAI_API_KEY
ai.gemini.api.key=${GEMINI_API_KEY:}
ai.gemini.api.base=${GEMINI_API_BASE:https://generativelanguage.googleapis.com/v1beta}
ai.gemini.api.model=${GEMINI_MODEL:gemini-1.5-flash}

# ============================================
# GOOGLE OAUTH2 CONFIGURATION
# ============================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account

# ============================================
# SERVER & LOGGING
# ============================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.web=INFO
logging.level.com.nguyenviethien=INFO
logging.level.root=INFO
logging.level.org.springframework=INFO

spring.flyway.enabled=false
