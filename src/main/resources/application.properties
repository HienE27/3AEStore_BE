spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Fix N+1 query problem với batch fetching
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true


# Disable automatic schema updates to avoid runtime DDL errors during development.
# Use Flyway migrations or manual schema changes instead.
spring.jpa.hibernate.ddl-auto=none
logging.level.org.hibernate.SQL=INFO

logging.level.org.springframework.web=INFO
logging.level.com.nguyenviethien=INFO


