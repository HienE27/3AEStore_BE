# ============================================
# Cấu hình AI - Generate Description (Tùy chọn)
# ============================================
# Hệ thống hỗ trợ 2 AI providers với priority:
# 1. Google Gemini API (FREE - Khuyến nghị)
# 2. OpenAI API (Paid - Fallback)
# 3. Template-based (Fallback cuối cùng)
#
# Để sử dụng:
# 1. Tạo file .env trong thư mục 3AEStore_BE và thêm:
#    GEMINI_API_KEY=your-gemini-api-key-here
#    OPENAI_API_KEY=your-openai-api-key-here (optional)
# 2. File .env sẽ tự động được load khi app khởi động
#
# Google Gemini API (FREE):
# - Đăng ký tại: https://makersuite.google.com/app/apikey
# - Free tier: 60 requests/phút
ai.gemini.api.key=${GEMINI_API_KEY:}
ai.gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent}

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}


# Force Google to show account selection screen every time
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account


spring.flyway.enabled=false
